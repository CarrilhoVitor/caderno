<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Seu bloco de notas pessoal, com salvamento automático.">
<title>Caderno — Bloco de notas</title>
<style>
:root{font-family:system-ui,sans-serif;color:#25291f;background:#fcfaef;--green:#34442e;--muted:#606756;--line:#e9e4d6;--paper:#fffdf5}
*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #59744b;outline-offset:4px}::selection{background:#d9e9c4}
header{max-width:920px;margin:auto;height:76px;padding:0 4vw;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-family:Georgia,serif;font-size:1.65rem;letter-spacing:-.03em}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--green);color:#fff}.mark svg{width:19px}.save{color:var(--muted);font-size:.85rem;text-align:right}
main{max-width:810px;margin:0 auto 28px;width:92%;display:block}.notes-view{padding:30px clamp(18px,5vw,46px);background:var(--paper);border:1px solid var(--line);border-radius:17px}.panel{height:calc(100dvh - 105px);min-height:390px;background:var(--paper);border:1px solid var(--line);border-radius:17px;overflow:hidden}main.open .notes-view,main:not(.open) .panel{display:none}
.side-head{padding:0 0 14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-family:Georgia,serif;font-size:1.95rem;font-weight:500;letter-spacing:-.03em;margin:0}.primary{white-space:nowrap;background:var(--green);border:0;color:white;border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:6px;font-size:.875rem}.primary:hover{background:#465a3d}.primary svg{display:block;width:16px}.list{display:flex;flex-direction:column}.list h2{margin:14px 0 7px;font-size:.82rem;font-weight:600;color:var(--muted)}.note{display:block;text-align:left;width:100%;border:1px solid transparent;border-radius:0;padding:14px 0;margin:0;background:transparent;border-bottom-color:var(--line)}.note:hover{background:#f5f0e0}.note:focus-visible{outline-offset:0}.note strong,.note span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note strong{font-size:.94rem}.note span{margin-top:5px;font-size:.85rem;color:var(--muted)}.empty-list{margin:14px 11px;color:var(--muted);font-size:.9rem}
.panel{min-width:0;min-height:0;display:flex;flex-direction:column}.toolbar{height:65px;flex:none;border-bottom:1px solid var(--line);padding:0 25px;display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;gap:5px}.icon{display:grid;place-items:center;width:40px;height:40px;background:transparent;border:0;border-radius:8px;color:var(--green)}.icon:hover:enabled,.icon[aria-pressed=true]{background:#e8eddf}.icon svg{width:19px;height:19px}.date{color:var(--muted);font-size:.85rem}.back{display:grid;flex:none}.toolbar .date{margin-right:auto}.editor{flex:1;min-height:0;display:flex;flex-direction:column;width:min(100%,810px);margin:0 auto;padding:42px clamp(22px,5vw,70px) 0}.editor input{font-family:Georgia,serif;font-size:2.65rem;letter-spacing:-.03em;border:0;background:transparent;width:100%;padding:0 0 22px}.editor textarea{resize:none;display:block;width:100%;flex:1;min-height:0;border:0;background:transparent;line-height:1.8;padding:0;font-size:1.05rem}.editor input::placeholder,.editor textarea::placeholder{color:#686d5e}.footer{border-top:1px solid var(--line);padding:13px 25px;color:var(--muted);font-size:.82rem}.blank{margin:auto;text-align:center;padding:30px;color:var(--muted)}[hidden]{display:none!important}
dialog{max-width:min(400px,90vw);border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:24px}dialog::backdrop{background:#20251d55}dialog h2{font-family:Georgia,serif;margin:0}dialog button{padding:8px 13px;border-radius:7px;border:1px solid var(--line);background:#f0f1e9}dialog .danger{background:#85392f;color:#fff;border-color:#85392f}dialog form{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:700px){header{height:61px;padding:0 17px}.brand{font-size:1.42rem}.row h1{font-size:1.65rem}.save{font-size:.75rem}main{width:100%;margin-bottom:0}.notes-view,.panel{border-width:1px 0 0;border-radius:0}.notes-view{min-height:calc(100dvh - 61px);padding-top:22px}.panel{height:calc(100dvh - 61px);min-height:0}.toolbar{padding:0 14px;height:55px}.editor{padding:25px 20px 0}.editor input{font-size:2rem}.footer{padding:10px 20px}}
</style>
<body>
<header><div class="brand"><span class="mark" data-icon="book"></span>Caderno</div><span id="save" class="save" role="status">Salvo neste navegador</span></header>
<main id="app">
<section class="notes-view" aria-label="Lista de notas">
<div class="side-head"><div class="row"><h1>Minhas notas</h1><button id="new" class="primary"><span data-icon="plus"></span>Nova nota</button></div>
</div>
<div id="list" class="list"></div>
</section>
<section class="panel" aria-label="Editor de notas">
<div id="toolbar" class="toolbar"><button id="back" class="icon back" title="Voltar às notas" aria-label="Voltar às notas" data-icon="back"></button><span id="date" class="date"></span><div class="actions"><button id="pin" class="icon" title="Fixar nota" aria-label="Fixar nota" aria-pressed="false" data-icon="pin"></button><button id="remove" class="icon" title="Excluir nota" aria-label="Excluir nota" data-icon="trash"></button></div></div>
<div id="editor" class="editor"><input id="title" aria-label="Título da nota" placeholder="Título da nota"><textarea id="body" aria-label="Conteúdo da nota" placeholder="Comece a escrever…"></textarea></div>
<div id="footer" class="footer"></div><p id="blank" class="blank" hidden>Escolha uma nota ou clique em Nova nota para escrever.</p>
</section>
</main>
<dialog id="confirm"><h2>Excluir nota?</h2><p>A nota será apagada deste navegador.</p><form method="dialog"><button value="cancel" autofocus>Cancelar</button><button class="danger" value="delete">Excluir</button></form></dialog>
<script>
const icons = {
  book:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18m3-13h4m-4 4h4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  back:'<path d="m14 6-6 6 6 6"/>',
  pin:'<path d="m15 3 6 6-3 1-2 4v3l-2 2-9-9 2-2h3l4-2zM9 15l-6 6"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/>'
};
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">' + icons[el.dataset.icon] + '</svg>';
});
const $ = id => document.getElementById(id);
const key = 'caderno.notes.v1';
const now = Date.now();
const seed = [
  {id:'welcome', title:'Boas-vindas ao Caderno', body:'Este é seu espaço para guardar ideias, listas e lembretes.\n\nUse Nova nota para começar a escrever. Você também pode editar esta nota ou fixar o que quiser manter no topo.\n\nSuas notas são salvas automaticamente neste navegador.', pinned:true, updated:now},
  {id:'ideas', title:'Ideias para guardar', body:'Livros para ler\nLugares para conhecer\nProjetos para começar', pinned:false, updated:now-1},
  {id:'week', title:'Planejamento da semana', body:'Anote aqui suas prioridades e lembretes.', pinned:false, updated:now-2}
];
let notes = seed;
try {
  const saved = localStorage.getItem(key);
  if (saved) notes = JSON.parse(saved);
} catch { $('save').textContent = 'Não foi possível ler as notas salvas'; }
let selected;
const current = () => notes.find(note => note.id === selected);
const shortDate = new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'});
const longDate = new Intl.DateTimeFormat('pt-BR',{dateStyle:'long',timeStyle:'short'});
function save() {
  try {
    localStorage.setItem(key, JSON.stringify(notes));
    $('save').textContent = 'Salvo neste navegador';
  } catch {
    $('save').textContent = 'Falha ao salvar neste navegador';
  }
}
function renderList() {
  const ordered = [...notes].sort((a,b) => b.updated - a.updated);
  const list = $('list');
  list.replaceChildren();
  for (const pinned of [true,false]) {
    const group = ordered.filter(note => note.pinned === pinned);
    if (!group.length) continue;
    const heading = document.createElement('h2');
    heading.textContent = pinned ? 'Fixadas' : 'Recentes';
    list.append(heading);
    for (const note of group) {
      const button = document.createElement('button');
      button.className = 'note';
      button.setAttribute('aria-current', note.id === selected);
      const title = document.createElement('strong');
      title.textContent = note.title.trim() || 'Sem título';
      const excerpt = document.createElement('span');
      excerpt.textContent = shortDate.format(note.updated) + ' · ' + (note.body.trim().replace(/\s+/g,' ') || 'Nota vazia');
      button.append(title, excerpt);
      button.onclick = () => openNote(note.id);
      list.append(button);
    }
  }
  if (!ordered.length) {
    const empty = document.createElement('p');
    empty.className = 'empty-list';
    empty.textContent = 'Crie sua primeira nota.';
    list.append(empty);
  }
}
function metadata(note) {
  const words = note.body.trim().split(/\s+/).filter(Boolean).length;
  $('date').textContent = longDate.format(note.updated);
  $('footer').textContent = words + (words === 1 ? ' palavra' : ' palavras');
  const label = note.pinned ? 'Desafixar nota' : 'Fixar nota';
  $('pin').title = label;
  $('pin').setAttribute('aria-label', label);
  $('pin').setAttribute('aria-pressed', note.pinned);
}
function renderEditor() {
  const note = current();
  for (const id of ['toolbar','editor','footer']) $(id).hidden = !note;
  $('blank').hidden = !!note;
  if (!note) return;
  $('title').value = note.title;
  $('body').value = note.body;
  metadata(note);
}
function openNote(id) {
  selected = id;
  $('app').classList.add('open');
  renderEditor();
  renderList();
  $('back').focus();
}
$('new').onclick = () => {
  const id = globalThis.crypto?.randomUUID?.() ?? String(Date.now()) + Math.random();
  notes.push({id,title:'',body:'',pinned:false,updated:Date.now()});
  save();
  openNote(id);
  $('title').focus();
};
$('back').onclick = () => {
  $('app').classList.remove('open');
  ($('list').querySelector('[aria-current=true]') ?? $('new')).focus();
};
for (const field of ['title','body']) {
  $(field).oninput = () => {
    const note = current();
    if (!note) return;
    note[field] = $(field).value;
    note.updated = Date.now();
    save();
    metadata(note);
    renderList();
  };
}
$('pin').onclick = () => {
  const note = current();
  note.pinned = !note.pinned;
  save();
  metadata(note);
  renderList();
};
$('remove').onclick = () => {
  $('confirm').returnValue = '';
  $('confirm').showModal();
};
$('confirm').onclose = () => {
  if ($('confirm').returnValue !== 'delete') return;
  notes = notes.filter(note => note.id !== selected);
  selected = [...notes].sort((a,b) => Number(b.pinned)-Number(a.pinned) || b.updated-a.updated)[0]?.id;
  save();
  $('app').classList.remove('open');
  renderList();
  renderEditor();
  ($('list').querySelector('[aria-current=true]') ?? $('new')).focus();
};
renderList();
renderEditor();
</script>
</body>
</html>
